
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hotel AI Copilot</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f3f4fa;
      margin: 0;
      padding: 30px;
    }

    .chat-container {
      max-width: 650px;
      margin: auto;
      background: white;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 4px 20px #00000012;
    }

    .mode-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 20px 0;
    }

   .mode-row label {
      font-weight: bold;
   }

   .mode-row select {
     flex: 1;
     min-width: 0;
     padding: 10px;
     border: 1px solid #ddd;
     border-radius: 8px;
     background: white;
    }

    h1 {
      color: #6554c0;
    }

    #messages {
      min-height: 280px;
      padding: 12px 0;
    }

    .message {
      padding: 12px;
      margin-bottom: 12px;
      border-radius: 12px;
      white-space: pre-wrap;
    }

    .user {
      background: #e8e3ff;
      margin-left: 20%;
    }

    .bot {
      background: #f1f2f5;
      margin-right: 20%;
    }

    form {
      display: flex;
      gap: 10px;
    }

    input {
      flex: 1;
      min-width: 0;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
    }

    button {
      background: #6554c0;
      color: white;
      border: none;
      padding: 12px 18px;
      border-radius: 8px;
      cursor: pointer;
    }
  </style>
</head>

<body>
  <div class="chat-container">
    <h1>Hotel AI Copilot</h1>
    <p>Ask me anything about your hotel stay.</p>

    <div class="mode-row">
      <label for="answer-mode">Answer Mode:</label>



<select id="answer-mode">
  <option value="faq">FAQ - Quick Answers</option>
  <option value="rag" disabled>AI Demo - Simulated Answers (No AWS)</option>
  <option value="live-rag" disabled>Real AI - Amazon Bedrock</option>
</select>

    </div>

    <div id="messages" aria-live="polite">
      <div class="message bot">
        Hello! How can I help you today?
      </div>
    </div>

    <form id="chat-form">
      <input
        id="question"
        type="text"
        placeholder="Ask a hotel question..."
        maxlength="500"
        required
      >
      <button type="submit">Send</button>
    </form>
  </div>
<script>
  // Find the elements in our HTML
  const form = document.getElementById("chat-form");
  const input = document.getElementById("question");
  const messages = document.getElementById("messages");
  const sendButton = form.querySelector("button");
  const answerMode = document.getElementById("answer-mode");



async function loadChatConfig() {
  const demoOption = answerMode.querySelector(
    'option[value="rag"]'
  );

  const liveOption = answerMode.querySelector(
    'option[value="live-rag"]'
  );

  // Keep both AI modes disabled initially
  demoOption.disabled = true;
  liveOption.disabled = true;

  try {
    const response = await fetch("/chat/config");

    if (!response.ok) {
      throw new Error("Could not load chat configuration");
    }

    const config = await response.json();

    // Enable each mode only when the backend permits it
    demoOption.disabled = config.demo_rag_enabled !== true;
    liveOption.disabled = config.live_rag_enabled !== true;

  } catch (error) {
    console.error("Chat configuration error:", error);

    // If configuration fails, keep both modes disabled
    demoOption.disabled = true;
    liveOption.disabled = true;
  }

  // Return to FAQ if the selected mode is unavailable
  if (answerMode.selectedOptions[0]?.disabled) {
    answerMode.value = "faq";
  }
}


loadChatConfig();


  // Display a message in the chat window
  function addMessage(text, sender, source = null) {
    const bubble = document.createElement("div");

    bubble.className = `message ${sender}`;
    bubble.textContent = text;

    if (source) {
      const sourceLabel = document.createElement("small");
      sourceLabel.textContent = `Source: ${source}`;

      bubble.appendChild(document.createElement("br"));
      bubble.appendChild(sourceLabel);
    }

    messages.appendChild(bubble);
    bubble.scrollIntoView({ behavior: "smooth" });
  }

  // Run when the guest clicks Send or presses Enter
  form.addEventListener("submit", async function (event) {
    event.preventDefault();

    const question = input.value.trim();

    if (!question) {
      return;
    }

    addMessage(question, "user");
    input.value = "";

    sendButton.disabled = true;
    sendButton.textContent = "Sending...";

    try {

const endpoints = {
  "faq": "/ask",
  "rag": "/ask/rag/demo",
  "live-rag": "/ask/rag"
};

const endpoint = endpoints[answerMode.value] || "/ask";


      const response = await fetch(endpoint, {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ question: question })
      });

      if (!response.ok) {
        throw new Error("The server could not answer.");
      }

      const data = await response.json();

      const source = Array.isArray(data.sources)
  ? data.sources.join(", ")
  : data.source;

addMessage(data.answer, "bot", source);

    } catch (error) {
      addMessage(
        "Sorry, something went wrong. Please try again.",
        "bot"
      );
      console.error(error);

    } finally {
      sendButton.disabled = false;
      sendButton.textContent = "Send";
      input.focus();
    }
  });
</script>
</body>

</html>
