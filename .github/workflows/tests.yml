name: Tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # Semantic search tests download the FastEmbed model on first use.
      # Keep it in a fixed folder so the cache step below can save it.
      FASTEMBED_CACHE_PATH: ${{ github.workspace }}/.fastembed_cache
      # Tests must never reach real AWS or Bedrock. No credentials are
      # configured, and the live and demo RAG modes stay off.
      ENABLE_LIVE_RAG: "false"
      ENABLE_DEMO_RAG: "false"
      AWS_EC2_METADATA_DISABLED: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Cache FastEmbed model
        uses: actions/cache@v4
        with:
          path: ${{ env.FASTEMBED_CACHE_PATH }}
          # Change the key when the model name or fastembed version changes.
          key: fastembed-bge-small-en-v1.5-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q
